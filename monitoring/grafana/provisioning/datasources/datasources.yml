apiVersion: 1

prune: true

datasources:

  # ============================================================
  # Infrastructure monitoring
  # ============================================================

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.13.5
      timeInterval: 15s


  # ============================================================
  # Pipeline / Data Quality monitoring
  # ============================================================

  - name: Job Market PostgreSQL
    uid: job-market-postgres
    type: postgres
    url: postgres:5432

    user: $__env{GRAFANA_DB_USER}

    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}

    jsonData:
      database: job_market
      sslmode: disable
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400

    editable: false
